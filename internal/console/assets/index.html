<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Friday Proxy</title>
  <meta name="theme-color" content="#0A0B12">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard">
        <img class="brand-mark" src="logo.png" alt="Friday Labs">
        <span class="brand-text">
          <span class="brand-name">Friday Proxy</span>
          <span class="brand-sub">by Friday Labs</span>
        </span>
      </a>
      <nav class="nav" id="nav"></nav>
      <button class="collapse-btn" id="collapse" type="button" aria-label="Collapse sidebar">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
